<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Control</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="panel" id="panel">
      <header class="top" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="dot" id="dot"></span>
          <input id="name" data-tauri-drag-region="false" spellcheck="false" />
        </div>
        <button id="pause" type="button">Pause</button>
      </header>
      <p class="status" id="status">Connecting…</p>
      <section id="permission" class="card hidden"></section>
      <section id="pairing" class="card hidden"></section>
      <ul id="machines"></ul>
      <section id="arrange" class="arrange hidden">
        <div id="canvas"></div>
        <div id="shelf"></div>
      </section>
      <footer>
        <button id="add" type="button">Add</button>
        <button id="arrange-toggle" type="button">Arrange</button>
      </footer>
      <p class="hint">Ctrl+Alt and an arrow jumps along the desk.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
